<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <title>now.gg</title>
  <rect width="100%" height="100%" fill="#14161a"/>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" id="f"
      src="https://now.gg"
      style="position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:#000"
      allow="fullscreen; autoplay; gamepad; microphone; camera; clipboard-write; accelerometer; gyroscope"
      allowfullscreen="allowfullscreen"
      referrerpolicy="no-referrer"></iframe>
  </foreignObject>
  <a xlink:href="https://now.gg" href="https://now.gg" target="_blank">
    <rect x="8" y="8" width="150" height="28" rx="6" fill="#262a31" opacity=".85"/>
    <text x="83" y="27" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#e8eaed">Open in new tab</text>
  </a>
  <script type="text/javascript"><![CDATA[
    // Optional: nowgg.svg?url=https://your-proxied-address
    try {
      var u = new URLSearchParams(location.search).get("url");
      if (u && /^(https?:)?\/\//i.test(u))
        document.getElementById("f").setAttribute("src", u);
    } catch (e) {}
  ]]></script>
</svg>
